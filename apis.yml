aid: dyno-nobel

name: Dyno Nobel

description: Dyno Nobel describes itself as a global leader in commercial explosives, delivering performance through practical innovation for
  mining, quarrying and industrial customers. Its site (www.dynonobel.com) covers explosives products such as initiation systems (Ranger electronic
  initiation) and bulk technology (Differential Energy), services such as DynoConsult, case studies, safety and sustainability, careers, and a
  newsroom; the company has moved its global headquarters to Queensland, Australia, and runs an investor centre at investors.dynonobel.com.au.
  No public developer API documentation was found on its own hosts; dev.dynonobel.com is a noindex staging mirror of the marketing site. Surfaced
  via the API Evangelist harvest backlog (australia-apidays-2026).

